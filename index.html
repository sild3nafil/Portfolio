<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YUHAOCHI Portfolio</title>
  <meta name="description" content="個人藝術作品集" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <header class="site-header">
    <!--<a class="brand" href="index.html" aria-label="首頁">YUHAO CHI</a>-->
    <a class="brand" href="index.html" aria-label="YUHAO CHI Home">
      <img src="assets/logo_v2.png" alt="YUHAO CHI">
    </a>
    <div class="menu-wrap">

      <button class="menu-btn" id="menuBtn" aria-label="開啟選單" aria-expanded="false">
        <span></span>
        <span></span>
      </button>

      <nav class="menu" id="menu">
        <a href="index.html">Works</a>
        <a href="#about">About</a>
        <a href="#social">Social</a>
      </nav>

    </div>
  </header>

  <main>
    <section class="intro">
      <div class="intro-head">

        <div>
          <p>SELECTED WORKS</p>
          <h1>作品 / 練習 / 記錄</h1>
        </div>

        <div class="sort-control">
          <span class="sort-label">SORT BY</span>

          <div class="sort-dropdown" id="sortDropdown">

            <button
              class="sort-trigger"
              id="sortTrigger"
              type="button"
              aria-expanded="false"
            >
              <span id="sortCurrent">Default</span>

              <span class="sort-arrow">↓</span>
            </button>

            <div class="sort-menu" id="sortMenu">
              <button type="button" data-sort="default">
                Default
              </button>

              <button type="button" data-sort="newest">
                Newest First
              </button>

              <button type="button" data-sort="oldest">
                Oldest First
              </button>
            </div>

          </div>
        </div>

      </div>
    </section>

    <section class="work-list" id="workList" aria-live="polite"></section>

    <nav class="pagination" id="pagination" aria-label="作品頁碼"></nav>

    <section class="about" id="about">
      <div class="section-kicker">ABOUT</div>
      <p>
        這段文字於2026年寫下：<br>
        <br>
        我是禹豪，<br>
        2025年休息到現在，前陣子決定重新整理自己的作品做成網站，畢竟AI實在是太方便了，<br>
        刪去了一些設計課的作業，留下了自己用心繪製的作品。<br>
        每當我仔細去觀察圖案的線條、用色或是無俚頭的畫面，我的角色總是能帶給我愉快，<br>
        也希望看到我作品的人也有相同的感受。<br>
        <br>
        無論如何，開心就好！<br>
      </p>
    </section>
  </main>

  <section class="social" id="social">
    <div class="section-kicker">SOCIAL</div>

    <div class="social-links">

      <a
        href="https://www.instagram.com/sild3nafil/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <img src="assets/instagram.png" alt="Instagram">
      </a>

      <a
        href="https://github.com/sild3nafil"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <img src="assets/github.png" alt="GitHub">
      </a>

      <a
        href="https://www.linkedin.com/in/yu-hao-chi/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
      >
        <img src="assets/linkedin.png" alt="LinkedIn">
      </a>

    </div>
  </section>

  <footer>
    <span>© 2026 YUHAO CHI</span>
    <span>Portfolio Archive</span>
  </footer>

  <!-- Doodle -->
  <canvas id="doodleCanvas"></canvas>

  <div class="doodle-ui">
    <button id="drawToggle" class="doodle-pencil" aria-label="Draw">
      ✎
    </button>

    <div class="doodle-tools">
      <button id="undoDrawing">UNDO</button>
      <button id="clearDrawing">CLEAR</button>
      <button id="doneDrawing">DONE</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
